# Snapshot identity for the vendored fftools/ and shim/ sources, and the
# prebuilt FFmpeg provider for each platform.
#
# Alignment policy: the fftools ref MUST be the source commit of the prebuilt
# package in use. Both platforms use BtbN daily builds; a build day produces
# every variant from the same commit, so running scripts/update.ps1 and
# scripts/update.sh back-to-back keeps [upstream] commit identical on both
# platforms â€” that is what makes the twin-ffplay comparison on each platform
# and across platforms meaningful.
#
# CMake reads the [windows] / [linux] asset for the running platform to derive
# the download URL and tree location. Edit assets only via scripts/update.*
# so the recorded commit stays consistent.

[upstream]
repository = "https://github.com/FFmpeg/FFmpeg"
commit = "e47273f4d9227152dcbf543cebaf9e2430ddbcc4"

[windows]  # BtbN win64 gpl-shared; SDL2 headers come from the VC dev zip
asset = "ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip"
sdl2_version = "2.32.10"

[linux]  # BtbN linux64 gpl-shared; requires libsdl2-dev from apt
asset = "ffmpeg-n9.0-latest-linux64-gpl-shared-9.0.tar.xz"

[sync]
last_synced = "2026-08-30"
fftools_ref = ""
reason = ""
